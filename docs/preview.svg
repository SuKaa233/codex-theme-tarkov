  <text x="88" y="92" fill="#e5e2d4" font-family="Segoe UI, sans-serif" font-size="42" font-weight="700" letter-spacing="4">CODEX FIELD KIT</text>
  <text x="90" y="128" fill="#9a9b88" font-family="Segoe UI, sans-serif" font-size="17" letter-spacing="2">TACTICAL TERMINAL THEME · NIGHT RAID / PAPER MAP</text>

