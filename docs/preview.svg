<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Codex Field Kit theme preview</title>
  <desc id="desc">Side by side previews of the Night Raid dark theme and Paper Map light theme.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="28" flood-color="#080904" flood-opacity=".28"/>
    </filter>
    <pattern id="grain" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M0 18h36M18 0v36" stroke="#ffffff" stroke-opacity=".025"/>
      <circle cx="8" cy="7" r="1" fill="#ffffff" fill-opacity=".035"/>
      <circle cx="28" cy="27" r="1" fill="#000000" fill-opacity=".04"/>
    </pattern>
  </defs>

  <rect width="1440" height="900" fill="#0d0f0b"/>
