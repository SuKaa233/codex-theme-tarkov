      <text x="228" y="242" fill="#9a4f2f">export async function</text><text x="382" y="242" fill="#725a22"> traceRoute</text><text x="465" y="242" fill="#262920">() {</text>
      <text x="244" y="270" fill="#707264">// verify the live contract</text>
      <text x="244" y="298" fill="#9a4f2f">const</text><text x="286" y="298" fill="#3e4236"> result</text><text x="334" y="298" fill="#262920"> = </text><text x="350" y="298" fill="#9a4f2f">await</text><text x="394" y="298" fill="#725a22"> inspect</text><text x="446" y="298" fill="#4f6b39">('route')</text>
