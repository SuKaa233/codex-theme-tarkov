      <text x="228" y="242" fill="#d18b58">export async function</text><text x="382" y="242" fill="#d8c58f"> traceRoute</text><text x="465" y="242" fill="#e5e2d4">() {</text>
      <text x="244" y="270" fill="#858775">// verify the live contract</text>
      <text x="244" y="298" fill="#d18b58">const</text><text x="286" y="298" fill="#cdd0be"> result</text><text x="334" y="298" fill="#e5e2d4"> = </text><text x="350" y="298" fill="#d18b58">await</text><text x="394" y="298" fill="#d8c58f"> inspect</text><text x="446" y="298" fill="#a9b67b">('route')</text>
